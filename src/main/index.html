<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Fridge Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<main id="app" class="page">
  <section class="card" id="auth-card">
    <h1>Smart Fridge<br />Management<br />System</h1>

    <div class="switch" role="tablist" aria-label="Login mode selector">
      <button id="tab-login" class="switch-btn active" type="button" role="tab" aria-selected="true">Login</button>
      <button id="tab-delivery" class="switch-btn" type="button" role="tab" aria-selected="false">Delivery</button>
    </div>

    <form id="password-form" class="panel" autocomplete="off">
      <label for="password-input">Password</label>
      <div class="input-row">
        <span class="icon" aria-hidden="true">🔒</span>
        <input id="password-input" name="password" type="password" placeholder="Enter Password" required />
      </div>
      <button class="action" type="submit">Enter System</button>
    </form>

    <form id="delivery-form" class="panel hidden" autocomplete="off">
      <label for="phone-input">Phone Number</label>
      <input id="phone-input" name="phone" type="tel" placeholder="Enter your phone number" pattern="[0-9+\-\s]{7,}" required />
      <button class="action" type="submit">Send OTP</button>
      <p id="delivery-hint" class="hint hidden" aria-live="polite"></p>
    </form>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
